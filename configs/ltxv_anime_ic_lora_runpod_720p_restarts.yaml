# Native 720p IC-LoRA Configuration with Cosine Restarts - Runpod Setup
# 1216x704x49 resolution with cosine_with_restarts scheduler
# Periodic LR restarts help escape local minima
# Optimized for 96GB GPU

# Model configuration
model:
  model_source: "Lightricks/LTX-Video-0.9.8-13B-distilled"
  training_mode: "lora"
  load_checkpoint: null

# LoRA configuration
lora:
  rank: 64  # Fast training
  alpha: 64
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
    # No feedforward for speed

# Conditioning configuration
conditioning:
  mode: "reference_video"
  first_frame_conditioning_p: 0.15
  reference_latents_dir: "reference_latents"

# Optimization configuration
optimization:
  learning_rate: 2e-4
  steps: 2500
  batch_size: 1
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit"
  scheduler_type: "cosine_with_restarts"
  scheduler_params:
    T_0: 500  # First restart cycle: 500 steps
    T_mult: 2  # Each cycle doubles: 500, 1000, 2000...
    eta_min: 1e-5  # Minimum LR at bottom of cycles
  enable_gradient_checkpointing: true

# Acceleration optimization
acceleration:
  mixed_precision_mode: "bf16"
  quantization: "int8-quanto"
  load_text_encoder_in_8bit: true
  compile_with_inductor: false  # Can try true on Runpod for extra speed
  compilation_mode: "reduce-overhead"

# Data configuration - RUNPOD PATHS (720P NATIVE RESOLUTION)
data:
  preprocessed_data_root: "/workspace/datasets/1216_704_49"
  num_dataloader_workers: 8  # Runpod has more CPU cores

# Validation configuration - RUNPOD PATHS
validation:
  prompts:
    - "Transform live action to anime style with vibrant colors"
    - "Convert real footage to Japanese animation art style"
    - "Anime style transformation with characteristic features"
  reference_videos:
    - "/workspace/datasets/1216_704_49/references/video_0001.mp4"
    - "/workspace/datasets/1216_704_49/references/video_0002.mp4"
    - "/workspace/datasets/1216_704_49/references/video_0003.mp4"
  negative_prompt: "worst quality, inconsistent style, blurry, distorted, western cartoon"
  video_dims: [1216, 704, 49]
  seed: 42
  inference_steps: 8
  interval: 250
  videos_per_prompt: 1
  guidance_scale: 1.0
  skip_initial_validation: false

# Checkpoint configuration
checkpoints:
  interval: 250
  keep_last_n: -1  # Keep all checkpoints

# Flow matching configuration
flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

# HuggingFace Hub configuration
hub:
  push_to_hub: false
  hub_model_id: null

# W&B configuration
wandb:
  enabled: false
  project: "anime-ic-lora-runpod-720p-restarts"
  entity: null
  tags: ["ic-lora", "anime-style", "runpod", "720p", "cosine-restarts"]
  log_validation_videos: true

# General configuration
seed: 42
output_dir: "/workspace/outputs/anime_ic_lora_720p_restarts"

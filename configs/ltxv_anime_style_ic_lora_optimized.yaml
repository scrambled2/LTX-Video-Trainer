# Optimized IC-LoRA Configuration for Anime Style Transfer
# Designed for live action → anime transformation on 40 paired videos

# Model configuration
model:
  model_source: "Lightricks/LTX-Video"  # Update to your 0.9.8 distilled model path
  training_mode: "lora"
  load_checkpoint: null

# LoRA configuration
lora:
  rank: 128  # Good balance for style transfer
  alpha: 128
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
    - "ff.net.0.proj"  # Include feedforward for better style capture
    - "ff.net.2"

# Conditioning configuration - CRITICAL for IC-LoRA
conditioning:
  mode: "reference_video"  # Enables IC-LoRA mode
  first_frame_conditioning_p: 0.15  # Lower for style transfer
  reference_latents_dir: "reference_latents"

# Optimization configuration
optimization:
  learning_rate: 1.5e-4  # Slightly lower for style stability
  steps: 3000  # 40 videos × 75 steps/video = good coverage
  batch_size: 1  # Start with 1, increase if memory allows
  gradient_accumulation_steps: 2  # Effective batch size = 2
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit"  # Save memory with 8-bit optimizer
  scheduler_type: "cosine"  # Better for style learning
  scheduler_params:
    num_cycles: 0.5  # Smooth convergence
  enable_gradient_checkpointing: true  # CRITICAL: Saves memory

# Acceleration optimization - IMPORTANT for your 96GB GPU
acceleration:
  mixed_precision_mode: "bf16"
  quantization: null  # Don't quantize transformer for quality
  load_text_encoder_in_8bit: true  # Save ~6GB
  compile_with_inductor: false  # Start false, enable after first run works
  compilation_mode: "reduce-overhead"

# Data configuration
data:
  preprocessed_data_root: "path/to/your/anime_dataset"
  num_dataloader_workers: 4  # Increase for faster data loading

# Validation configuration
validation:
  prompts:
    - "Transform live action footage into anime art style"
    - "Convert real video to Japanese animation style"
    - "Anime style transformation of live footage"
  reference_videos:
    - "path/to/validation_ref1.mp4"
    - "path/to/validation_ref2.mp4"
    - "path/to/validation_ref3.mp4"
  negative_prompt: "worst quality, inconsistent style, blurry, distorted, western cartoon"
  video_dims: [768, 448, 41]  # Must match preprocessing
  seed: 42
  inference_steps: 40
  interval: 250
  videos_per_prompt: 1
  guidance_scale: 3.5

# Checkpoint configuration
checkpoints:
  interval: 250
  keep_last_n: 5

# Flow matching configuration
flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

# HuggingFace Hub configuration
hub:
  push_to_hub: false
  hub_model_id: null

# W&B configuration
wandb:
  enabled: false
  project: "anime-style-ic-lora"
  entity: null
  tags: ["ic-lora", "anime-style", "video2video"]
  log_validation_videos: true

# General configuration
seed: 42
output_dir: "outputs/anime_style_ic_lora"
